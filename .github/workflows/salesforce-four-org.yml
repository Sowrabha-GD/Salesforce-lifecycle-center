name: Salesforce Four-Org CI/CD

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-uat:
    name: Validate and deploy to UAT
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to UAT
        env:
          SFDX_AUTH_URL: ${{ secrets.UAT_SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SFDX_AUTH_URL" > "$RUNNER_TEMP/uat-auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/uat-auth.txt" --alias UAT --set-default
          rm -f "$RUNNER_TEMP/uat-auth.txt"

      - name: Validate deployment in UAT
        run: sf project deploy validate --target-org UAT --source-dir force-app --test-level RunLocalTests

      - name: Deploy to UAT
        run: sf project deploy start --target-org UAT --source-dir force-app --test-level RunLocalTests --wait 60

  deploy-preprod:
    name: Validate and deploy to PRE-PROD
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to PRE-PROD
        env:
          SFDX_AUTH_URL: ${{ secrets.PREPROD_SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SFDX_AUTH_URL" > "$RUNNER_TEMP/preprod-auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/preprod-auth.txt" --alias PREPROD --set-default
          rm -f "$RUNNER_TEMP/preprod-auth.txt"

      - name: Validate deployment in PRE-PROD
        run: sf project deploy validate --target-org PREPROD --source-dir force-app --test-level RunLocalTests

      - name: Deploy to PRE-PROD
        run: sf project deploy start --target-org PREPROD --source-dir force-app --test-level RunLocalTests --wait 60

  deploy-production:
    name: Validate and deploy to Production
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Production
        env:
          SFDX_AUTH_URL: ${{ secrets.PROD_SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SFDX_AUTH_URL" > "$RUNNER_TEMP/prod-auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/prod-auth.txt" --alias PROD --set-default
          rm -f "$RUNNER_TEMP/prod-auth.txt"

      - name: Validate deployment in Production
        run: sf project deploy validate --target-org PROD --source-dir force-app --test-level RunLocalTests

      - name: Deploy validated source to Production
        run: sf project deploy start --target-org PROD --source-dir force-app --test-level RunLocalTests --wait 60

